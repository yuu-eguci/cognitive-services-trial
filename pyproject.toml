[project]
name = "cognitive-services-trial"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "azure-storage-blob>=12.31.1",
    "mysql-connector-python>=26.10.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S113"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
